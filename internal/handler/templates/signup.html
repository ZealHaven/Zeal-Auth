{{define "signup.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up</title>
    {{template "styles" .}}
</head>
<body>
    <div class="card">
        <div class="brand"></div>
        <h1>Create your account</h1>

        {{if .Error}}
        <div class="error">{{.Error}}</div>
        {{end}}

        <form method="POST" action="/signup-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required value="{{.Email}}">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
            </div>
            <button type="submit" class="btn-primary">Sign up</button>
        </form>

        <div class="divider">or</div>

        <a href="/oauth/google" style="text-decoration:none">
            <button type="button" class="btn-social">Continue with Google</button>
        </a>
        <a href="/oauth/github" style="text-decoration:none">
            <button type="button" class="btn-social">Continue with GitHub</button>
        </a>

        <div class="links">
            Already have an account? <a href="/login">Log in</a>
        </div>
    </div>
</body>
</html>
{{end}}
