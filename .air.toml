root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/auth-server"
  cmd = "go build -o ./tmp/auth-server ./cmd/server"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "e2e", "bin", "node_modules", "test-results"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "html", "toml"]
  kill_delay = "0s"
  send_interrupt = false
  stop_on_error = true

[log]
  time = false

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[misc]
  clean_on_exit = true
