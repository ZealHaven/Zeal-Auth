{{define "login.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Log In</title>
    {{template "styles" .}}
</head>
<body>
    <div class="card">
        <div class="brand"></div>
        <h1>Log in to your account</h1>

        {{if .Error}}
        <div class="error">{{.Error}}</div>
        {{end}}

        <form method="POST" action="/login-form{{if .ReturnTo}}?return_to={{.ReturnTo}}{{end}}">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required value="{{.Email}}">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Your password" required>
            </div>
            <button type="submit" class="btn-primary">Log in</button>
        </form>

        <div class="links">
            <a href="/forgot-password">Forgot password?</a>
        </div>

        <div class="divider">or</div>

        <a href="/oauth/google" style="text-decoration:none">
            <button type="button" class="btn-social">Continue with Google</button>
        </a>
        <a href="/oauth/github" style="text-decoration:none">
            <button type="button" class="btn-social">Continue with GitHub</button>
        </a>

        <div class="links">
            New here? <a href="/signup">Create an account</a>
        </div>
    </div>
</body>
</html>
{{end}}
