{{define "forgot-password.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password</title>
    {{template "styles" .}}
</head>
<body>
    <div class="card">
        <div class="brand"></div>
        <h1>Reset your password</h1>

        {{if .Success}}
        <div class="success-icon">&#9993;</div>
        <p class="text-center text-muted mb-8">
            If an account exists with <strong>{{.Email}}</strong>, we've sent a reset link.
        </p>
        {{else}}
        <p class="text-center text-muted mb-8">
            Enter your email and we'll send you a reset link.
        </p>
        <form method="POST" action="/forgot-password-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <button type="submit" class="btn-primary">Send reset link</button>
        </form>
        {{end}}

        <div class="links">
            <a href="/login">Back to log in</a>
        </div>
    </div>
</body>
</html>
{{end}}
