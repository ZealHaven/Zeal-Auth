{{define "reset-password.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reset Password</title>
    {{template "styles" .}}
</head>
<body>
    <div class="card">
        <div class="brand"></div>
        <h1>Set new password</h1>

        {{if .Error}}
        <div class="error">{{.Error}}</div>
        {{end}}

        {{if .Success}}
        <div class="success-icon">&#10003;</div>
        <p class="text-center text-muted mb-8">Your password has been updated.</p>
        <a href="/login" style="text-decoration:none">
            <button type="button" class="btn-primary">Log in</button>
        </a>
        {{else}}
        <form method="POST" action="/reset-password-form?token={{.Token}}">
            <div class="form-group">
                <label for="password">New password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
                <p class="helper">At least 8 characters</p>
            </div>
            <button type="submit" class="btn-primary">Reset password</button>
        </form>
        {{end}}
    </div>
</body>
</html>
{{end}}
