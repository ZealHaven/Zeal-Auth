{{define "styles"}}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Inter', -apple-system, sans-serif;
        background: #0F1319;
        color: #E7ECF2;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .card {
        background: #171D26;
        border: 1px solid #2A3341;
        border-radius: 12px;
        padding: 32px;
        width: 100%;
        max-width: 360px;
    }
    .brand {
        width: 30px;
        height: 30px;
        background: #5FD9C0;
        border-radius: 6px;
        margin: 0 auto 24px;
    }
    h1 {
        font-size: 18px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 24px;
    }
    .form-group { margin-bottom: 16px; }
    label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #8493A6;
        margin-bottom: 6px;
    }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        background: #0F1319;
        border: 1px solid #2A3341;
        border-radius: 8px;
        color: #E7ECF2;
        font-size: 14px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.15s;
    }
    input:focus { border-color: #5FD9C0; }
    input::placeholder { color: #8493A6; }
    .btn-primary {
        width: 100%;
        padding: 10px;
        background: #5FD9C0;
        color: #0F1319;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-social {
        width: 100%;
        padding: 10px;
        background: transparent;
        color: #E7ECF2;
        border: 1px solid #2A3341;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
        margin-bottom: 8px;
        transition: border-color 0.15s;
    }
    .btn-social:hover { border-color: #5FD9C0; }
    .divider {
        text-align: center;
        color: #8493A6;
        font-size: 12px;
        margin: 16px 0;
        position: relative;
    }
    .divider::before,
    .divider::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 40%;
        height: 1px;
        background: #2A3341;
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    .links {
        text-align: center;
        margin-top: 16px;
        font-size: 13px;
        color: #8493A6;
    }
    .links a { color: #5FD9C0; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #EF4444;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 16px;
    }
    .success-icon {
        width: 48px;
        height: 48px;
        background: rgba(95, 217, 192, 0.15);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        font-size: 24px;
    }
    .text-center { text-align: center; }
    .text-muted { color: #8493A6; font-size: 14px; }
    .mb-8 { margin-bottom: 8px; }
    .helper { font-size: 12px; color: #8493A6; margin-top: 4px; }
    .app-banner {
        text-align: center;
        font-size: 13px;
        color: #8493A6;
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid #2A3341;
    }
</style>
{{end}}
